# ST1005 requires error strings to be lowercase and unpunctuated. A dozen error
# values in this tree deliberately violate that, and they must: they reproduce
# the vendor application's own messages verbatim, capitalisation and full stops
# included, because a user troubleshooting a failed scan will paste the string
# the vendor's app printed into a search box (SPEC.md §9.6).
#
# Each one carries a comment at its declaration saying so. Suppressing the check
# globally is the lesser evil: the alternative is a dozen scattered //lint:ignore
# directives, or silently letting CI fail on a deliberate decision.
#
# Every other staticcheck check stays on.
checks = ["all", "-ST1005"]
