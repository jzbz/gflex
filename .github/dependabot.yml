version: 2

# Scoped to GitHub Actions only, and deliberately so.
#
# ci.yml pins its actions by commit SHA, which is what makes them immutable --
# and also what makes them go stale silently, security fixes included, since
# nothing about a SHA tells you it is out of date. Dependabot is the other half
# of that decision: it raises the bump as a PR with the release notes attached.
#
# Go modules are not watched. There are two direct dependencies, both stable,
# both pinned with hashes in go.sum, and a CLI that vendors nothing and runs no
# server has little to gain from a steady trickle of patch bumps. Add a
# gomod entry here if that balance ever changes.
#
# One thing neither ecosystem reaches: the staticcheck that ci.yml `go install`s
# by commit SHA. It resolves outside the module graph, so no gomod entry would
# see it either -- STATICCHECK_COMMIT and STATICCHECK_VERSION are bumped by
# hand, together, and ci.yml fails the run if only one of them moves.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    labels:
      - ci
